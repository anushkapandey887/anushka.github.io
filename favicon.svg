<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with Egyptian papyrus color -->
  <rect width="100" height="100" fill="#e8d5b5"/>
  
  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#8b6f47" stroke-width="3"/>
  <rect x="6" y="6" width="88" height="88" fill="none" stroke="#c4925a" stroke-width="1.5"/>
  
  <!-- Egyptian profile silhouette (side view) -->
  <!-- Face -->
  <ellipse cx="50" cy="45" rx="12" ry="16" fill="#c4925a"/>
  
  <!-- Neck -->
  <rect x="48" y="55" width="8" height="12" fill="#c4925a"/>
  
  <!-- Hair/Headdress back -->
  <path d="M 38 35 Q 35 45 37 60 L 42 60 L 42 35 Z" fill="#2c2416"/>
  
  <!-- Hair/Headdress front -->
  <path d="M 50 30 L 55 35 L 60 38 L 62 42 L 60 45 L 58 35 Z" fill="#2c2416"/>
  
  <!-- Headdress band (golden) -->
  <rect x="42" y="33" width="8" height="3" fill="#c4925a"/>
  <line x1="50" y1="33" x2="58" y2="36" stroke="#c4925a" stroke-width="3"/>
  
  <!-- Eye (Egyptian style - almond shaped) -->
  <ellipse cx="52" cy="42" rx="3" ry="1.5" fill="#2c2416"/>
  <line x1="49" y1="42" x2="55" y2="42" stroke="#2c2416" stroke-width="1"/>
  
  <!-- Nose (profile) -->
  <path d="M 57 40 L 60 45 L 58 46" fill="none" stroke="#8b6f47" stroke-width="1.5"/>
  
  <!-- Lips -->
  <line x1="58" y1="50" x2="62" y2="50" stroke="#8b6f47" stroke-width="2"/>
  
  <!-- Decorative collar/necklace -->
  <path d="M 48 65 Q 50 70 52 65 Q 54 70 56 65" fill="none" stroke="#c4925a" stroke-width="2"/>
  <circle cx="48" cy="65" r="1.5" fill="#8b6f47"/>
  <circle cx="52" cy="68" r="1.5" fill="#8b6f47"/>
  <circle cx="56" cy="65" r="1.5" fill="#8b6f47"/>
  
  <!-- Corner decorative elements -->
  <path d="M 10 10 L 20 10 L 10 20 Z" fill="#8b6f47"/>
  <path d="M 90 10 L 80 10 L 90 20 Z" fill="#8b6f47"/>
  <path d="M 10 90 L 20 90 L 10 80 Z" fill="#8b6f47"/>
  <path d="M 90 90 L 80 90 L 90 80 Z" fill="#8b6f47"/>
</svg>
